AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  HighGround: street-level flood answers for Chennai residents.
  Amplify Hosting (site, model outputs, tiles), S3 (model outputs the Lambdas read), Lambda + API Gateway,
  DynamoDB, SNS, EventBridge Scheduler, Amazon Bedrock (Strands Agents SDK), Amazon Location Service.

Parameters:
  BedrockModelId:
    Type: String
    Description: Bedrock model or inference profile id used by the assistant and alert writer.
  AdminToken:
    Type: String
    NoEcho: true
    Description: Shared secret for the demo "Run now" endpoint.
  SiteUrl:
    Type: String
    Default: ""

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 512
    Layers: [!Ref CommonLayer]
    Environment:
      Variables:
        DATA_BUCKET: !Ref DataBucket
        DATA_PREFIX: data/
        TABLE: !Ref SubscribersTable
        TOPIC_ARN: !Ref AlertsTopic
        MODEL_ID: !Ref BedrockModelId

Resources:
  # ------------------------------------------------------------------ data
  # Private: only the Lambdas read it. Browsers get the same files from Amplify Hosting (see SiteApp).
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag, Content-Length, Content-Range, Accept-Ranges]
            MaxAge: 3600

  # ------------------------------------------------------------------ alerts
  SubscribersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: HighGround

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 3600

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/common/
      CompatibleRuntimes: [python3.12]

  StrandsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: Strands Agents SDK (AWS open source) and dependencies
      ContentUri: layers/strands/
      CompatibleRuntimes: [python3.12]

  SubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/subscribe/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref SubscribersTable}
        - S3ReadPolicy: {BucketName: !Ref DataBucket}
        - Statement:
            - Effect: Allow
              Action: [sns:Subscribe, sns:ListSubscriptionsByTopic, sns:SetSubscriptionAttributes]
              Resource: "*"
      Events:
        Post:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /subscribe, Method: POST}

  ForecastCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/forecast_check/
      Handler: app.handler
      Timeout: 180
      Environment:
        Variables:
          ADMIN_TOKEN: !Ref AdminToken
          SITE_URL: !Ref SiteUrl
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - DynamoDBCrudPolicy: {TableName: !Ref SubscribersTable}
        - SNSPublishMessagePolicy: {TopicName: !GetAtt AlertsTopic.TopicName}
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"
      Events:
        Every3Hours:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(3 hours)
            Description: HighGround forecast check
        RunNow:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /admin/run, Method: POST}
        Current:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /data/current.json, Method: GET}

  AssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/assistant/
      Handler: app.handler
      Timeout: 90
      MemorySize: 1024
      Layers: [!Ref StrandsLayer]   # CommonLayer comes from Globals
      Policies:
        - S3ReadPolicy: {BucketName: !Ref DataBucket}
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"
      Events:
        Ask:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /ask, Method: POST}

  GeocodeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/geocode/
      Handler: app.handler
      Timeout: 15
      Policies:
        - Statement:
            - Effect: Allow
              Action: [geo-places:Geocode, geo-places:Autocomplete, geo-places:SearchText, geo-places:Suggest]
              Resource: !Sub "arn:aws:geo-places:${AWS::Region}::provider/default"
      Events:
        Geocode:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /geocode, Method: POST}

  # ------------------------------------------------------------------ site
  SiteApp:
    Type: AWS::Amplify::App
    Properties:
      Name: highground
      Platform: WEB
      CustomRules:
        # tonight's forecast changes every 3 hours, so it is not part of the published site: the forecast-check
        # Lambda writes it to S3 and this rule passes the request on to the API
        - Source: /data/current.json
          Target: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/data/current.json"
          Status: "200"
        # files with these extensions are served as they are; any other path is the app (index.html).
        # mjs = MapLibre's worker, pbf = map label fonts, webmanifest = the installable app
        - Source: "</^[^.]+$|\\.(?!(css|gif|ico|jpg|jpeg|js|mjs|png|txt|svg|woff|woff2|ttf|map|json|geojson|webp|pmtiles|bin|pbf|webmanifest)$)([^.]+$)/>"
          Target: /index.html
          Status: "200"
      # offline: the service worker and the page are never cached by the CDN or the browser, so a new
      # version reaches phones; hashed assets are immutable
      CustomHeaders: |
        customHeaders:
          - pattern: '/sw.js'
            headers:
              - key: Cache-Control
                value: no-cache
          - pattern: '/index.html'
            headers:
              - key: Cache-Control
                value: no-cache
          - pattern: '/data/current.json'
            headers:
              - key: Cache-Control
                value: no-cache
          - pattern: '/manifest.webmanifest'
            headers:
              - key: Cache-Control
                value: no-cache
              - key: Content-Type
                value: application/manifest+json
          - pattern: '/assets/**'
            headers:
              - key: Cache-Control
                value: public, max-age=31536000, immutable

  SiteBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt SiteApp.AppId
      BranchName: main
      Stage: PRODUCTION

Outputs:
  DataBucketName: {Value: !Ref DataBucket}
  ApiUrl: {Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"}
  TopicArn: {Value: !Ref AlertsTopic}
  AmplifyAppId: {Value: !GetAtt SiteApp.AppId}
  SiteUrl: {Value: !Sub "https://main.${SiteApp.DefaultDomain}"}
